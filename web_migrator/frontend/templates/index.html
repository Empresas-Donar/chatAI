<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppSheet → PostgreSQL Migrator</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app-shell">

  <header>
    <div class="header-top">
      <div>
        <h1 data-i18n="app.title">AppSheet → PostgreSQL Migrator</h1>
        <p data-i18n="app.subtitle">Upload CSVs, validate schema, preview data, then sync to PostgreSQL.</p>
      </div>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <!-- ================================================================== -->
  <!-- STEP 1: UPLOAD                                                       -->
  <!-- ================================================================== -->
  <div id="step-upload" class="step">
    <div class="step-header">
      <div class="step-number">1</div>
      <h2 data-i18n="step1.title">Upload CSV files</h2>
    </div>

    <div class="card">
      <form id="upload-form">
        <div class="form-group">
          <label for="app-name" data-i18n="upload.app_name.label">App name</label>
          <input
            type="text"
            id="app-name"
            name="app_name"
            placeholder="contratistas_isla_maipo"
            required
          />
          <span class="form-hint" data-i18n="upload.app_name.hint"></span>
        </div>

        <div class="form-group">
          <label for="csv-files" data-i18n="upload.files.label">CSV files</label>
          <input
            type="file"
            id="csv-files"
            name="files"
            accept=".csv"
            multiple
            required
          />
          <span class="form-hint" data-i18n="upload.files.hint"></span>
        </div>

        <div id="upload-error" class="error-box hidden"></div>

        <div class="actions">
          <button type="submit" id="upload-btn" class="btn btn-primary" data-i18n="upload.btn">
            Upload &amp; Analyse
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================================================================== -->
  <!-- STEP 2: VALIDATION                                                   -->
  <!-- ================================================================== -->
  <div id="step-validate" class="step hidden">
    <div class="step-header">
      <div class="step-number">2</div>
      <h2 data-i18n="step2.title">Validation results</h2>
    </div>

    <div id="validation-cards"></div>

    <div class="actions">
      <button id="back-to-upload" class="btn btn-secondary" data-i18n="validate.back">← Back</button>
      <button id="confirm-btn" class="btn btn-primary" data-i18n="validate.confirm">Review &amp; Confirm →</button>
    </div>
  </div>

  <!-- ================================================================== -->
  <!-- STEP 3: CONFIRMATION                                                 -->
  <!-- ================================================================== -->
  <div id="step-confirm" class="step hidden">
    <div class="step-header">
      <div class="step-number">3</div>
      <h2 data-i18n="step3.title">Confirm sync</h2>
    </div>

    <div class="card">
      <div class="confirm-summary">
        <p><span data-i18n="confirm.app">App</span>: <strong><span id="confirm-app-name"></span></strong></p>
        <p><span data-i18n="confirm.schema">Schema pattern</span>: <code><span id="confirm-schema"></span></code></p>
        <p><span data-i18n="confirm.total_rows">Total rows to insert</span>: <strong><span id="confirm-total-rows"></span></strong></p>
      </div>

      <div class="table-scroll">
        <table class="confirm-table">
          <thead>
            <tr>
              <th data-i18n="confirm.col.table">Table</th>
              <th data-i18n="confirm.col.rows">Rows</th>
              <th data-i18n="confirm.col.columns">Columns</th>
              <th data-i18n="confirm.col.warnings">Warnings</th>
            </tr>
          </thead>
          <tbody id="confirm-table-body"></tbody>
        </table>
      </div>

      <div id="sync-error" class="error-box hidden" style="margin-top:16px;"></div>

      <div class="actions">
        <button id="back-to-validate" class="btn btn-secondary" data-i18n="confirm.back">← Back</button>
        <button id="dryrun-btn" class="btn btn-secondary" data-i18n="confirm.dryrun">Dry Run</button>
        <button id="sync-btn" class="btn btn-primary" data-i18n="confirm.sync">Confirm &amp; Sync →</button>
      </div>
    </div>
  </div>

  <!-- ================================================================== -->
  <!-- STEP 4: RESULT                                                       -->
  <!-- ================================================================== -->
  <div id="step-result" class="step hidden">
    <div class="step-header">
      <div class="step-number">4</div>
      <h2 id="result-title"></h2>
    </div>

    <div class="card">
      <div id="result-summary" class="result-summary"></div>

      <div class="table-scroll">
        <table class="result-table">
          <thead>
            <tr>
              <th data-i18n="result.col.table">Table</th>
              <th data-i18n="result.col.result">Result</th>
            </tr>
          </thead>
          <tbody id="result-table-body"></tbody>
        </table>
      </div>

      <div class="actions">
        <button id="back-from-result" class="btn btn-secondary hidden" data-i18n="result.back">← Back to confirm</button>
        <button id="restart-btn" class="btn btn-primary" data-i18n="result.restart">Start new migration</button>
      </div>
    </div>
  </div>

</div><!-- .app-shell -->

<!-- ====================================================================== -->
<!-- PREVIEW MODAL                                                           -->
<!-- ====================================================================== -->
<div id="preview-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="preview-title"></h3>
      <button id="close-preview" class="modal-close" title="Close">✕</button>
    </div>
    <div id="preview-table-container"></div>
    <div class="modal-footer" id="preview-info"></div>
  </div>
</div>

<!-- ====================================================================== -->
<!-- LOADING OVERLAY                                                         -->
<!-- ====================================================================== -->
<div id="loading-overlay" class="loading-overlay hidden">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="overlay-msg">Loading…</p>
    <div id="log-lines" class="log-lines"></div>
    <button id="overlay-stop-btn" class="btn btn-danger btn-sm hidden" data-i18n="overlay.stop">
      Stop
    </button>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
