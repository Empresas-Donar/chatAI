# config.yaml
# -----------
# Configuration for the AppSheet → PostgreSQL schema generator.
#
# database:
#   Connection parameters. If left empty, the tool falls back to
#   DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD env vars.
#
# csv_server_base_path:
#   Absolute path where the PostgreSQL SERVER process can read the CSV files.
#   Used only in the COPY-based 02_load_data.sql.
#   If using data_loader.py (client-side), this is not needed.
#
# apps:
#   Per-app configuration. The app key must match the --app argument
#   and the subfolder name inside raw_csv/.
#
#   schema:
#     PostgreSQL schema name. Defaults to the app name if omitted.
#
#   table_overrides:
#     Rename a CSV file stem to a different table name.
#     Key = CSV filename without extension.
#     Value = desired table name in PostgreSQL.
#
#   load_order:
#     List of table stems in the order they should be loaded.
#     Respects foreign key dependencies. Unlisted tables are loaded last.
#
#   force_types:
#     Override the inferred type for specific columns.
#     Key = exact column name as it appears in the CSV header.
#     Value = PostgreSQL type string.

# ---------------------------------------------------------------------------
# Database connection (optional — env vars take priority if set)
# ---------------------------------------------------------------------------
database:
  host: ""
  port: 5432
  dbname: ""
  user: ""
  password: ""

# ---------------------------------------------------------------------------
# Path accessible by the PostgreSQL server for COPY statements
# ---------------------------------------------------------------------------
csv_server_base_path: "/tmp/raw_csv"

# ---------------------------------------------------------------------------
# App definitions
# ---------------------------------------------------------------------------
apps:

  contratistas_isla_maipo:
    schema: appsheet

    # Map CSV filename stem → PostgreSQL table name
    table_overrides: {}

    # Load order respecting FK dependencies
    load_order:
      - empresa
      - labor
      - contratistas
      - trabajadores
      - tratos
      - registro
      - registro_trato
      - resumen
      - pagos
      - cultivos
      - cultivos_detalle
      - usuarios

    # Force specific column types (override inference)
    force_types: {}

  medicion_pozos:
    schema: appsheet
    table_overrides: {}
    load_order: []
    force_types: {}
