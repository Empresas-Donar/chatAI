steps:
  # ── Step 1: Role security tests — must pass before any deploy ──────────
  # Connects to the real DB and validates that all role assignments are correct.
  # A failure here means someone lost access or gained unauthorized privileges.
  - name: 'python:3.12-slim'
    id: 'role-security-tests'
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet psycopg2-binary python-dotenv pytest itsdangerous &&
        python -m pytest chatai/tests/test_roles.py -v --tb=short
    env:
      - 'DB_HOST=$$DB_HOST'
      - 'DB_PORT=$$DB_PORT'
      - 'DB_NAME=$$DB_NAME'
      - 'DB_USER=$$DB_USER'
      - 'DB_PASSWORD=$$DB_PASSWORD'
      - 'SECRET_KEY=$$SECRET_KEY'
    secretEnv:
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - SECRET_KEY

  # ── Step 2: Build Docker image ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    waitFor: ['role-security-tests']
    args:
      - build
      - -f
      - chatai/Dockerfile
      - -t
      - southamerica-west1-docker.pkg.dev/integraciones-484915/integraciones/chatai:latest
      - .

  # ── Step 3: Deploy to Cloud Run ─────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'cloud-run-deploy'
    waitFor: ['docker-build']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - chatai
      - --image=southamerica-west1-docker.pkg.dev/integraciones-484915/integraciones/chatai:latest
      - --region=southamerica-west1
      - --project=integraciones-484915
      - --platform=managed

availableSecrets:
  secretManager:
    - versionName: projects/integraciones-484915/secrets/DB_HOST/versions/latest
      env: DB_HOST
    - versionName: projects/integraciones-484915/secrets/DB_PORT/versions/latest
      env: DB_PORT
    - versionName: projects/integraciones-484915/secrets/DB_NAME/versions/latest
      env: DB_NAME
    - versionName: projects/integraciones-484915/secrets/DB_USER/versions/latest
      env: DB_USER
    - versionName: projects/integraciones-484915/secrets/DB_PASSWORD/versions/latest
      env: DB_PASSWORD
    - versionName: projects/integraciones-484915/secrets/SECRET_KEY/versions/latest
      env: SECRET_KEY

images:
  - southamerica-west1-docker.pkg.dev/integraciones-484915/integraciones/chatai:latest
