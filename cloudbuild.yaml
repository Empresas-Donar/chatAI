steps:
  # ── Step 1: Role security tests — must pass before any deploy ──────────
  # Connects to the real DB and validates that all role assignments are correct.
  # A failure here means someone lost access or gained unauthorized privileges.
  - name: 'python:3.12-slim'
    id: 'role-security-tests'
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet psycopg2-binary python-dotenv pytest itsdangerous fastapi &&
        python -m pytest chatai/tests/test_roles.py -v --tb=short
    secretEnv:
      - DATABASE_URL
      - SECRET_KEY

  # ── Step 2: Build Docker image (verification only — NOT pushed/deployed) ─
  # Deploys to Cloud Run are handled exclusively by GitHub Actions
  # (.github/workflows/deploy.yml), which pushes the image tagged by the
  # immutable commit SHA and deploys that exact digest. This pipeline used
  # to also push `:latest` and run `gcloud run deploy --image=...:latest`
  # in parallel with GitHub Actions on every push to main. Because the
  # image push only happened via the `images:` field *after* the deploy
  # step ran, each pipeline's own deploy step actually deployed whatever
  # `:latest` happened to be in the registry at that instant — often a
  # different, unrelated build's image. Under concurrent pushes this raced
  # with GitHub Actions and silently redeployed stale code even after the
  # correct fix had already gone live (see specs/113-cloudbuild-latest-tag-race).
  # Kept as a build-only smoke check so `role-security-tests` + Dockerfile
  # correctness are still validated by this trigger without touching prod.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    waitFor: ['role-security-tests']
    args:
      - build
      - -f
      - chatai/Dockerfile
      - -t
      - southamerica-west1-docker.pkg.dev/integraciones-484915/integraciones/chatai:cloudbuild-verify
      - .

availableSecrets:
  secretManager:
    - versionName: projects/integraciones-484915/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/integraciones-484915/secrets/SECRET_KEY/versions/latest
      env: SECRET_KEY

options:
  logging: CLOUD_LOGGING_ONLY
