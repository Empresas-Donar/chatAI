name: Harvest quality PDF

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Vacío = informe original. Otro valor = archivo en config/reports, por ejemplo isla."
        required: false
        default: ""
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automations/harvest_quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Manual check
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HARVEST_QUALITY_SESSION: ${{ secrets.HARVEST_QUALITY_SESSION }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ -n "$PROFILE" ]; then
            python -m harvest_quality now "$PROFILE"
          else
            python -m harvest_quality now
          fi
